name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      pages: read # required by wait-for-pages-deployment in rossjrw/pr-preview-action

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 🏗 Setup Python
        if: ${{ github.event.action != 'closed' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          python-version: 3.14
          cache: pip
          check-latest: true

      - name: 📦 Install dependencies
        if: ${{ github.event.action != 'closed' }}
        run: pip install -r requirements.txt

      - name: 📦 Get GitHub Pages URL
        uses: TuftsRT/get-pages-url@03ca0ae86ff191bc1167b5f0d72773e69ca4e5a9 # v1.0.1
        id: get-url

      - name: ✍️ Edit site_url
        run: yq -yi '.site_url = "${{ steps.get-url.outputs.url }}"' mkdocs.yml

      - name: 🏗️ Build
        if: ${{ github.event.action != 'closed' }}
        env:
          NO_MKDOCS_2_WARNING: 1
        run: mkdocs build -s

      - name: 📦 Extract domain
        id: domain
        run: |
          url="${{ steps.get-url.outputs.url }}"
          domain=$(echo "$url" | awk -F/ '{print $3}')
          echo "domain=$domain" >> $GITHUB_OUTPUT

      - name: 📦 Upload preview build to GitHub
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: ${{ steps.domain.outputs.domain }}
          wait-for-pages-deployment: false

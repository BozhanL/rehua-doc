upstream api {
    server api:3001 resolve;
    zone api 32k;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    return 302 https://localhost$request_uri;
}

map $server_protocol $altSvc {
    default 'h3=":$server_port"; ma=86400, h2=":$server_port"; ma=86400';
    'HTTP/2.0' 'h3=":$server_port"; ma=86400';
    'HTTP/3.0' '';
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;

    server_name localhost;

    ssl_certificate /cert/localhost.cer;
    ssl_certificate_key /cert/localhost.key;

    add_header Alt-Svc $altSvc always;

    root /usr/share/nginx/html/rehua/;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-PORT $remote_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        # allow upload large file
        client_max_body_size 100M;
    }
}

services:
  nginx:
    image: nginx:1.30-trixie@sha256:cba33810a525dbbd68cc31a0114d5bbe8c4833d8eca8d6b85bcf91eb55ee474a
    ports:
      - 80:80/tcp
      - 443:443/tcp
      - 443:443/udp
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf/conf.d:/etc/nginx/conf.d:ro

      - ./nginx/html:/usr/share/nginx/html:ro
      - ./certs/nginx:/cert:ro
      - ./nginx/log:/var/log/nginx:rw
    environment:
      TZ: Pacific/Auckland
    restart: always

  api:
    image: ghcr.io/bozhanl/rehua-api:main@sha256:7329e5f9e6594e3d2f53cc4372726852c7d87036410bfbe1f7358b27997e78d2
    environment:
      TZ: Pacific/Auckland

      NODE_ENV: production

      API_CERT: /cert/api.pem
      API_KEY: /cert/api.key
      API_CA: /cert/ca.pem
      MONGODB_URI_FILE: /run/secrets/mongo_url
    volumes:
      - ./certs/api:/cert:ro
    secrets:
      - mongo_url
    init: true
    restart: always

  mongo:
    image: mongo:8.3@sha256:0f887198e29c093fd2b36c3e2eb43c7b98e47c081d89fbd5bc212da0cd43ec58
    restart: unless-stopped
    environment:
      TZ: Pacific/Auckland
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    user: 1000:1000
    volumes:
      - ./mongo/data:/data/db:rw
      - ./mongo/configdb:/data/configdb:rw

      - ./mongo/config:/etc/mongo:ro
      - ./certs/mongo:/cert:ro

      - ./mongo/log:/var/log/mongodb:rw
    secrets:
      - mongo_username
      - mongo_password
    command: ['--config', '/etc/mongo/mongod.conf']

secrets:
  mongo_url:
    file: ./mongo/mongodb_url.txt

  mongo_username:
    file: ./mongo/mongo_username.txt
  mongo_password:
    file: ./mongo/mongo_password.txt
